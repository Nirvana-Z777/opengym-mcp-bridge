name: Test and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG && process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must match package.json version');
          }
          console.log(`Package version: ${version}`);
          JS
      - name: Run tests and require a nonempty suite
        run: |
          npm test | tee test-results.tap
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const output = readFileSync('test-results.tap', 'utf8');
          const count = output.match(/^# tests (\d+)$/m);
          if (!count || Number(count[1]) < 1) throw new Error('No tests executed');
          console.log(`Executed ${count[1]} tests`);
          JS

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Audit Docker build context
        run: |
          audit_dir=$(mktemp -d)
          cp -R . "$audit_dir/source"
          mkdir "$audit_dir/source/secrets" "$audit_dir/source/store"
          for file in .env secrets/sentinel store/sentinel docker-compose.yaml tunnel-client.yaml; do
            printf '%s\n' 'SYNTHETIC-CONTEXT-AUDIT-ONLY' > "$audit_dir/source/$file"
          done
          docker buildx build --file - --output "type=local,dest=$audit_dir/export" "$audit_dir/source" <<'DOCKERFILE'
          FROM scratch
          COPY . /
          DOCKERFILE
          python3 - "$audit_dir/export" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          expected = {'Dockerfile', '.dockerignore', 'package.json', 'LICENSE'}
          expected.update(p.as_posix() for p in Path('src').rglob('*.mjs'))
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert actual == expected, f'Unexpected Docker context files: {actual ^ expected}'
          print(f'Verified {len(actual)} runtime context files; local-data canaries excluded')
          PY
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/nirvana-z777/opengym-mcp-bridge
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify published runtime image
        env:
          IMAGE_REF: ghcr.io/nirvana-z777/opengym-mcp-bridge@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE_REF"
          docker run --rm --network none --entrypoint node "$IMAGE_REF" --input-type=module -e '
            import assert from "node:assert/strict";
            import { existsSync, readFileSync, readdirSync } from "node:fs";
            import { dispatch } from "./src/mcp.mjs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            const reply = await dispatch({ jsonrpc: "2.0", id: 1, method: "initialize" }, { writes: false });
            assert.equal(reply.result.serverInfo.version, version);
            for (const file of [".env", ".git", "tests", "docker-compose.yaml", "tunnel-client.yaml"]) {
              assert.equal(existsSync(file), false, `Unexpected runtime file: ${file}`);
            }
            assert.deepEqual(readdirSync("/secrets"), []);
            assert.deepEqual(readdirSync("/store"), []);
            console.log(`Verified runtime image; MCP version: ${version}; no bundled credentials or user data`);
          '
