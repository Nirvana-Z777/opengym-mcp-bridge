config_version: 1
control_plane:
  base_url: https://api.openai.com
  tunnel_id: REPLACE_WITH_YOUR_TUNNEL_ID
  api_key: file:/run/secrets/openai-runtime-key
mcp:
  server_urls:
    - channel: main
      url: http://bridge:3003/mcp
  extra_headers:
    X-Bridge-Token: file:/run/secrets/mcp-access-token
  discovery_extra_headers:
    X-Bridge-Token: file:/run/secrets/mcp-access-token
log:
  level: info
  format: json
health:
  listen_addr: 127.0.0.1:8080
