name: Verify published v0.4.1 image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-published-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_REPOSITORY: ghcr.io/nirvana-z777/opengym-mcp-bridge
      EXPECTED_DIGEST: sha256:82a98b2e42c95f144148adff126820689096c09bc3ba5ce140080fa098ac49dc
      EXPECTED_REVISION: 1cadd0774284c107d5b609d34847c765a8e7a8e3
    steps:
      - name: Anonymous pulls and actual published container startup
        shell: bash
        run: |
          set -euo pipefail
          anonymous_config=$(mktemp -d)
          verify_container=''
          trap 'if [ -n "${verify_container:-}" ]; then docker --config "$anonymous_config" rm -f "$verify_container" >/dev/null; fi; rm -rf "$anonymous_config"' EXIT
          for image_tag in 0.4.1 latest; do
            docker --config "$anonymous_config" pull --platform linux/amd64 "$IMAGE_REPOSITORY:$image_tag"
            docker --config "$anonymous_config" image inspect "$IMAGE_REPOSITORY:$image_tag" > "$anonymous_config/image.json"
            node --input-type=module - "$anonymous_config/image.json" <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const [image]=JSON.parse(readFileSync(process.argv[2],'utf8'));
          assert.equal(image.Os,'linux');assert.equal(image.Architecture,'amd64');
          assert(image.RepoDigests.includes(process.env.IMAGE_REPOSITORY+'@'+process.env.EXPECTED_DIGEST));
          assert.equal(image.Config.Labels['org.opencontainers.image.version'],'0.4.1');
          assert.equal(image.Config.Labels['org.opencontainers.image.revision'],process.env.EXPECTED_REVISION);
          console.log('Anonymous published tag verified: linux/amd64; version 0.4.1; '+process.env.EXPECTED_DIGEST);
          JS
          done
          verify_container=$(docker --config "$anonymous_config" run -d --rm --network none \
            -e OPENGYM_BASE_URL=http://127.0.0.1:1 -e OPENGYM_ALLOW_WRITES=1 \
            -e MCP_HOST=127.0.0.1 "$IMAGE_REPOSITORY@$EXPECTED_DIGEST")
          verify_ready=0
          for attempt in $(seq 1 20); do
            if docker --config "$anonymous_config" exec "$verify_container" node --input-type=module -e \
              'const r=await fetch("http://127.0.0.1:3003/healthz"); if(!r.ok) process.exit(1);' >/dev/null 2>&1; then
              verify_ready=1
              break
            fi
            sleep 1
          done
          test "$verify_ready" -eq 1
          docker --config "$anonymous_config" exec -i "$verify_container" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const token=readFileSync('/secrets/mcp-access-token','utf8').trim();
          const call=async(method,id)=>{
            const response=await fetch('http://127.0.0.1:3003/mcp',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({jsonrpc:'2.0',id,method})});
            assert.equal(response.status,200);const data=await response.json();assert.equal(data.error,undefined);return data.result;
          };
          const initialized=await call('initialize',1);assert.equal(initialized.serverInfo.version,'0.4.1');
          const registry=await call('tools/list',2);assert.equal(registry.tools.length,37);assert.equal(new Set(registry.tools.map(t=>t.name)).size,37);
          assert.equal(JSON.parse(readFileSync('/app/package.json','utf8')).version,'0.4.1');
          console.log('Published immutable image default HTTP startup verified; authenticated MCP 0.4.1; 37 tools; no network or host volumes');
          JS
          {
            echo '### Published image verification passed'
            echo '- Anonymous pulls: 0.4.1 and latest'
            echo '- Platform / MCP version / registered tools: linux/amd64 / 0.4.1 / 37'
            echo '- Default HTTP container startup: passed with network disabled and no host mounts'
            echo "- Immutable image: $IMAGE_REPOSITORY@$EXPECTED_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
